# Perfil de produccion (ecosistema Docker: postgres-db en la red interna andesstay-net)
# Las variables se inyectan desde la orquestacion (compose/EC2/CI).
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-db:5432/andesstay_db}
spring.datasource.username=${DB_USERNAME:unknown}
spring.datasource.password=${DB_PASSWORD:unknown}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false